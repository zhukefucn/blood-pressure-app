<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血压记录系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .card-header {
            border-radius: 15px 15px 0 0 !important;
            font-weight: 600;
        }
        .stat-card {
            text-align: center;
            padding: 20px;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
        .time-badge {
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 20px;
        }
        .morning { background-color: #fff3cd; color: #856404; }
        .noon { background-color: #d1ecf1; color: #0c5460; }
        .evening { background-color: #d4edda; color: #155724; }
        .bp-normal { color: #28a745; }
        .bp-elevated { color: #ffc107; }
        .bp-high { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-white text-center mb-4">🩺 血压记录系统</h2>
        
        <!-- 统计卡片 -->
        <div class="row mb-4" id="statsCards">
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="stat-value" id="totalRecords">0</div>
                    <div class="stat-label">总记录数</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="stat-value" id="avgSystolic">0</div>
                    <div class="stat-label">平均收缩压</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="stat-value" id="avgDiastolic">0</div>
                    <div class="stat-label">平均舒张压</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="stat-value" id="avgPulse">0</div>
                    <div class="stat-label">平均脉搏</div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 录入表单 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-plus-circle"></i> 新增记录
                    </div>
                    <div class="card-body">
                        <form id="recordForm">
                            <input type="hidden" id="recordId">
                            <div class="mb-3">
                                <label class="form-label">日期</label>
                                <input type="date" class="form-control" id="recordDate" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">测量时段</label>
                                <select class="form-select" id="measurementTime" required>
                                    <option value="morning">早晨</option>
                                    <option value="noon">中午</option>
                                    <option value="evening">晚上</option>
                                </select>
                            </div>
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label">收缩压</label>
                                    <input type="number" class="form-control" id="systolic" min="60" max="250" required placeholder="高压">
                                </div>
                                <div class="col">
                                    <label class="form-label">舒张压</label>
                                    <input type="number" class="form-control" id="diastolic" min="40" max="150" required placeholder="低压">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">脉搏 (次/分)</label>
                                <input type="number" class="form-control" id="pulse" min="40" max="200" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">备注</label>
                                <textarea class="form-control" id="notes" rows="2"></textarea>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary" id="submitBtn">保存记录</button>
                                <button type="button" class="btn btn-outline-secondary" id="cancelBtn" style="display:none">取消编辑</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 时段统计 -->
                <div class="card mt-4">
                    <div class="card-header bg-info text-white">时段统计</div>
                    <div class="card-body" id="timeStats">
                        <p class="text-muted">暂无数据</p>
                    </div>
                </div>
            </div>

            <!-- 记录列表和图表 -->
            <div class="col-md-8">
                <!-- 趋势图表 -->
                <div class="card mb-4">
                    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                        <span>趋势图表</span>
                        <select class="form-select form-select-sm" id="chartDays" style="width: auto;">
                            <option value="7">最近7天</option>
                            <option value="14">最近14天</option>
                            <option value="30" selected>最近30天</option>
                            <option value="90">最近90天</option>
                        </select>
                    </div>
                    <div class="card-body">
                        <canvas id="trendChart" height="200"></canvas>
                    </div>
                </div>

                <!-- 记录列表 -->
                <div class="card">
                    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                        <span>历史记录</span>
                        <div>
                            <input type="date" class="form-control form-control-sm d-inline-block" id="filterStart" style="width: auto;">
                            <span class="text-white mx-1">至</span>
                            <input type="date" class="form-control form-control-sm d-inline-block" id="filterEnd" style="width: auto;">
                            <button class="btn btn-sm btn-light ms-2" id="filterBtn">筛选</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>日期</th>
                                        <th>时段</th>
                                        <th>收缩压</th>
                                        <th>舒张压</th>
                                        <th>脉搏</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="recordsTable">
                                    <tr><td colspan="6" class="text-center text-muted">加载中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">确认删除</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">确定要删除这条记录吗？此操作不可恢复。</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">删除</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api';
        let trendChart = null;
        let deleteId = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('recordDate').valueAsDate = new Date();
            loadRecords();
            loadStatistics();
            loadTrend();
        });

        // 加载记录列表
        async function loadRecords(startDate = null, endDate = null) {
            let url = `${API_BASE}/records`;
            const params = new URLSearchParams();
            if (startDate) params.append('start_date', startDate);
            if (endDate) params.append('end_date', endDate);
            if (params.toString()) url += '?' + params.toString();

            try {
                const res = await fetch(url);
                const records = await res.json();
                renderRecords(records);
            } catch (err) {
                document.getElementById('recordsTable').innerHTML = 
                    '<tr><td colspan="6" class="text-center text-danger">加载失败</td></tr>';
            }
        }

        // 渲染记录表格
        function renderRecords(records) {
            if (!records.length) {
                document.getElementById('recordsTable').innerHTML = 
                    '<tr><td colspan="6" class="text-center text-muted">暂无记录</td></tr>';
                return;
            }

            const timeLabels = { morning: '早晨', noon: '中午', evening: '晚上' };
            const html = records.map(r => {
                const bpClass = getBpClass(r.systolic, r.diastolic);
                return `
                    <tr>
                        <td>${r.record_date}</td>
                        <td><span class="time-badge ${r.measurement_time}">${timeLabels[r.measurement_time]}</span></td>
                        <td class="${bpClass}">${r.systolic}</td>
                        <td class="${bpClass}">${r.diastolic}</td>
                        <td>${r.pulse}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="editRecord(${r.id})">编辑</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="showDeleteModal(${r.id})">删除</button>
                        </td>
                    </tr>
                `;
            }).join('');
            document.getElementById('recordsTable').innerHTML = html;
        }

        // 血压等级判断
        function getBpClass(systolic, diastolic) {
            if (systolic < 120 && diastolic < 80) return 'bp-normal';
            if (systolic < 140 && diastolic < 90) return 'bp-elevated';
            return 'bp-high';
        }

        // 加载统计数据
        async function loadStatistics() {
            try {
                const res = await fetch(`${API_BASE}/statistics`);
                const stats = await res.json();
                
                document.getElementById('totalRecords').textContent = stats.total_records;
                document.getElementById('avgSystolic').textContent = stats.avg_systolic || 0;
                document.getElementById('avgDiastolic').textContent = stats.avg_diastolic || 0;
                document.getElementById('avgPulse').textContent = stats.avg_pulse || 0;

                // 时段统计
                if (stats.by_time && Object.keys(stats.by_time).length) {
                    const timeHtml = Object.entries(stats.by_time).map(([time, data]) => `
                        <div class="mb-2">
                            <strong>${time}</strong> (${data.count}次):
                            收缩压 ${data.avg_systolic} / 舒张压 ${data.avg_diastolic} / 脉搏 ${data.avg_pulse}
                        </div>
                    `).join('');
                    document.getElementById('timeStats').innerHTML = timeHtml;
                }
            } catch (err) {
                console.error('加载统计失败:', err);
            }
        }

        // 加载趋势图
        async function loadTrend(days = 30) {
            try {
                const res = await fetch(`${API_BASE}/trend?days=${days}`);
                const data = await res.json();
                renderTrendChart(data);
            } catch (err) {
                console.error('加载趋势失败:', err);
            }
        }

        // 渲染趋势图表
        function renderTrendChart(data) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            if (trendChart) {
                trendChart.destroy();
            }

            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.date),
                    datasets: [
                        {
                            label: '收缩压',
                            data: data.map(d => d.avg_systolic),
                            borderColor: '#dc3545',
                            backgroundColor: 'rgba(220, 53, 69, 0.1)',
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: '舒张压',
                            data: data.map(d => d.avg_diastolic),
                            borderColor: '#0d6efd',
                            backgroundColor: 'rgba(13, 110, 253, 0.1)',
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: '脉搏',
                            data: data.map(d => d.avg_pulse),
                            borderColor: '#198754',
                            backgroundColor: 'rgba(25, 135, 84, 0.1)',
                            tension: 0.3,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' }
                    },
                    scales: {
                        y: { beginAtZero: false }
                    }
                }
            });
        }

        // 表单提交
        document.getElementById('recordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const recordId = document.getElementById('recordId').value;
            const data = {
                record_date: document.getElementById('recordDate').value,
                measurement_time: document.getElementById('measurementTime').value,
                systolic: parseInt(document.getElementById('systolic').value),
                diastolic: parseInt(document.getElementById('diastolic').value),
                pulse: parseInt(document.getElementById('pulse').value),
                notes: document.getElementById('notes').value || null
            };

            try {
                let res;
                if (recordId) {
                    res = await fetch(`${API_BASE}/records/${recordId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                } else {
                    res = await fetch(`${API_BASE}/records`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                }

                if (res.ok) {
                    resetForm();
                    loadRecords();
                    loadStatistics();
                    loadTrend(document.getElementById('chartDays').value);
                    alert(recordId ? '更新成功！' : '保存成功！');
                } else {
                    const err = await res.json();
                    alert('保存失败: ' + err.detail);
                }
            } catch (err) {
                alert('请求失败: ' + err.message);
            }
        });

        // 编辑记录
        async function editRecord(id) {
            try {
                const res = await fetch(`${API_BASE}/records/${id}`);
                const record = await res.json();
                
                document.getElementById('recordId').value = record.id;
                document.getElementById('recordDate').value = record.record_date;
                document.getElementById('measurementTime').value = record.measurement_time;
                document.getElementById('systolic').value = record.systolic;
                document.getElementById('diastolic').value = record.diastolic;
                document.getElementById('pulse').value = record.pulse;
                document.getElementById('notes').value = record.notes || '';
                
                document.getElementById('submitBtn').textContent = '更新记录';
                document.getElementById('cancelBtn').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                alert('加载记录失败');
            }
        }

        // 重置表单
        function resetForm() {
            document.getElementById('recordForm').reset();
            document.getElementById('recordId').value = '';
            document.getElementById('recordDate').valueAsDate = new Date();
            document.getElementById('submitBtn').textContent = '保存记录';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        document.getElementById('cancelBtn').addEventListener('click', resetForm);

        // 删除功能
        function showDeleteModal(id) {
            deleteId = id;
            new bootstrap.Modal(document.getElementById('deleteModal')).show();
        }

        document.getElementById('confirmDelete').addEventListener('click', async () => {
            if (!deleteId) return;
            
            try {
                const res = await fetch(`${API_BASE}/records/${deleteId}`, { method: 'DELETE' });
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
                    loadRecords();
                    loadStatistics();
                    loadTrend(document.getElementById('chartDays').value);
                } else {
                    alert('删除失败');
                }
            } catch (err) {
                alert('请求失败: ' + err.message);
            }
        });

        // 筛选功能
        document.getElementById('filterBtn').addEventListener('click', () => {
            const start = document.getElementById('filterStart').value;
            const end = document.getElementById('filterEnd').value;
            loadRecords(start || null, end || null);
        });

        // 图表天数切换
        document.getElementById('chartDays').addEventListener('change', (e) => {
            loadTrend(parseInt(e.target.value));
        });
    </script>
</body>
</html>
